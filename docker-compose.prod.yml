services:
  postgres:
    image: postgres:16-alpine
    container_name: vividev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-vividev}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-vividev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-vividev}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vividev

  redis:
    image: redis:7-alpine
    container_name: vividev-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vividev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vividev-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-vividev}:${DB_PASS}@postgres:5432/${DB_NAME:-vividev}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-https://vividev.id}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO}
      WA_NUMBER: ${WA_NUMBER}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      UPLOAD_DIR: /app/uploads
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - vividev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vividev-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - vividev

  nginx:
    image: nginx:1.27-alpine
    container_name: vividev-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - vividev

networks:
  vividev:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:
  nginx_cache:
