# ViviDev.id - Nginx Configuration
# Production: Nginx + PM2 + Let's Encrypt

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=contact:10m rate=1r/m;

server {
    listen 80;
    server_name vividev.id www.vividev.id;
    # Redirect HTTP to HTTPS
    return 301 https://vividev.id$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.vividev.id;
    # SSL cert diperlukan agar browser bisa establish TLS sebelum redirect.
    # Tanpa ini, https://www.vividev.id akan timeout / SSL_ERROR_RX_RECORD_TOO_LONG.
    ssl_certificate /etc/letsencrypt/live/vividev.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vividev.id/privkey.pem;
    # Redirect www to non-www
    return 301 https://vividev.id$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vividev.id;

    # SSL - Let's Encrypt (Certbot will update these paths)
    ssl_certificate /etc/letsencrypt/live/vividev.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vividev.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/vividev.id/chain.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Root for React build
    root /var/www/vividev-id/frontend/dist;
    index index.html;

    # Logs
    access_log /var/log/nginx/vividev.access.log;
    error_log /var/log/nginx/vividev.error.log;

    # Block hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sitemap, robots.txt & llms.txt - served by Express
    location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API routes - proxied to Express
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Uploaded files — served directly from filesystem by Nginx.
    # This MUST come before the SPA fallback (location /) so that
    # /uploads/* requests never hit try_files and get swallowed by index.html.
    # Path MUST match UPLOAD_DIR in backend .env: /var/www/vividev-id/backend/uploads
    location /uploads/ {
        alias /var/www/vividev-id/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Security: block directory listing and PHP execution inside uploads
        autoindex off;
        location ~* \.php$ { deny all; }
    }

    # Optimized images — also served directly from filesystem
    location /uploads/opt/ {
        alias /var/www/vividev-id/backend/uploads/opt/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        autoindex off;
    }

    # Block direct admin access (optional: uncomment to whitelist IPs)
    # location /admin {
    #     allow YOUR_OFFICE_IP;
    #     deny all;
    # }

    # SPA fallback - React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Limit request size
    client_max_body_size 10M;
}
