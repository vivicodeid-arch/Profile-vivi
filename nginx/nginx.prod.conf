# ViviDev.id - Nginx Docker Production Config

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=contact:10m rate=1r/m;

    server {
        listen 80;
        server_name vividev.id www.vividev.id;
        return 301 https://vividev.id$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name www.vividev.id;
        ssl_certificate /etc/letsencrypt/live/vividev.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vividev.id/privkey.pem;
        return 301 https://vividev.id$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name vividev.id;

        ssl_certificate /etc/letsencrypt/live/vividev.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vividev.id/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/vividev.id/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml font/woff font/woff2;

        client_max_body_size 10M;

        location ~ /\. {
            deny all;
            return 404;
        }

        # Docker internal DNS resolver — resolve upstreams dynamically at request time
        resolver 127.0.0.11 valid=30s ipv6=off;

        # API → backend container
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            set $backend_upstream http://backend:5000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Uploads → backend container
        location /uploads/ {
            set $backend_upstream http://backend:5000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Sitemap, robots.txt, llms.txt → backend
        location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt)$ {
            set $backend_upstream http://backend:5000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static assets → frontend container
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA → frontend container
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
