
services:
  postgres:
    image: postgres:16-alpine
    container_name: vividev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vividev
      POSTGRES_PASSWORD: vividev_dev_password
      POSTGRES_DB: vividev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vividev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vividev-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
