<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Default SEO (overridden per-page by react-helmet-async) -->
    <title>ViviDev.id — Jasa Web Developer Profesional</title>
    <meta name="description" content="ViviDev.id menyediakan jasa web developer profesional. Kami membangun website modern, cepat, dan SEO-friendly untuk bisnis Anda." />
    <link rel="canonical" href="https://vividev.id" />

    <!-- Open Graph -->
    <meta property="og:title" content="ViviDev.id — Jasa Web Developer Profesional" />
    <meta property="og:description" content="ViviDev.id menyediakan jasa web developer profesional. Kami membangun website modern, cepat, dan SEO-friendly untuk bisnis Anda." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vividev.id" />
    <meta property="og:image" content="https://vividev.id/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ViviDev.id" />
    <meta property="og:locale" content="id_ID" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ViviDev.id — Jasa Web Developer Profesional" />
    <meta name="twitter:description" content="ViviDev.id menyediakan jasa web developer profesional. Kami membangun website modern, cepat, dan SEO-friendly untuk bisnis Anda." />
    <meta name="twitter:image" content="https://vividev.id/og-default.jpg" />

    <!-- Hero image is served from the CMS (settings.heroImageUrl) at runtime,
         so it can't be preloaded statically. The <img> in HeroSection uses
         fetchPriority="high" + srcset instead. Keep the fallback asset tiny. -->

    <!-- Plus Jakarta Sans font
         - display=optional: browser uses cached font immediately, falls back to
           system font on first visit with no swap/shift at all. This eliminates
           FILS (Font-Induced Layout Shift) which was causing CLS to spike.
         - On repeat visits the font is cached → zero layout shift, zero FOIT.
         - preconnect still helps warm the connection for the first visit.    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=optional"
      rel="stylesheet"
    />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ViviDev.id",
      "url": "https://vividev.id",
      "logo": "https://vividev.id/favicon.png",
      "description": "Jasa web developer profesional asal Bandung, Indonesia — membangun website modern, cepat, dan SEO-friendly sejak 2019.",
      "foundingDate": "2019",
      "areaServed": "ID",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+62-857-9811-2370",
        "contactType": "customer service",
        "areaServed": "ID",
        "availableLanguage": ["Indonesian", "English"]
      },
      "sameAs": [
        "https://www.instagram.com/vividev.id",
        "https://wa.me/6285798112370"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- App Shell: Eliminates LCP Element Render Delay by painting immediately before React hydration -->
      <style>
        .app-shell {
          min-height: 100vh;
          background: linear-gradient(135deg, #0D47A1 0%, #1565C0 25%, #1976D2 50%, #0D47A1 75%, #0a3880 100%);
          display: flex;
          align-items: center;
          padding-top: 5rem;
          font-family: 'Plus Jakarta Sans', sans-serif;
          overflow: hidden;
          position: relative;
        }
        .app-shell-content {
          max-width: 1200px;
          margin: 0 auto;
          padding: 3rem 1rem;
          width: 100%;
          position: relative;
          z-index: 10;
        }
        .app-shell-badge {
          display: inline-block;
          padding: 6px 16px;
          border-radius: 9999px;
          font-size: 0.75rem;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          margin-bottom: 1.5rem;
          background-color: rgba(144, 202, 249, 0.12);
          border: 1px solid rgba(144, 202, 249, 0.30);
          color: #90CAF9;
        }
        .app-shell-h1 {
          color: white;
          font-size: 2.25rem;
          font-weight: 700;
          line-height: 1.25;
          margin-bottom: 1.5rem;
          max-width: 42rem;
        }
        @media (min-width: 1024px) {
          .app-shell-h1 { font-size: 3rem; }
        }
        @media (min-width: 1280px) {
          .app-shell-h1 { font-size: 3.75rem; }
        }
      </style>
      <div class="app-shell" aria-hidden="true">
        <div class="app-shell-content">
          <div style="max-width: 42rem;">
            <div class="app-shell-badge">Web Developer Profesional</div>
            <h1 class="app-shell-h1">
              Bangun Website Profesional untuk Bisnis Anda
            </h1>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
