<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Default SEO (overridden per-page by react-helmet-async) -->
    <title>ViviDev.id — Jasa Web Developer Profesional</title>
    <meta name="description" content="ViviDev.id menyediakan jasa web developer profesional. Kami membangun website modern, cepat, dan SEO-friendly untuk bisnis Anda." />
    <link rel="canonical" href="https://vividev.id" />

    <!-- Open Graph -->
    <meta property="og:title" content="ViviDev.id — Jasa Web Developer Profesional" />
    <meta property="og:description" content="ViviDev.id menyediakan jasa web developer profesional. Kami membangun website modern, cepat, dan SEO-friendly untuk bisnis Anda." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vividev.id" />
    <meta property="og:image" content="https://vividev.id/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ViviDev.id" />
    <meta property="og:locale" content="id_ID" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ViviDev.id — Jasa Web Developer Profesional" />
    <meta name="twitter:description" content="ViviDev.id menyediakan jasa web developer profesional. Kami membangun website modern, cepat, dan SEO-friendly untuk bisnis Anda." />
    <meta name="twitter:image" content="https://vividev.id/og-default.jpg" />

    <!-- Hero image is served from the CMS (settings.heroImageUrl) at runtime,
         so it can't be preloaded statically. The <img> in HeroSection uses
         fetchPriority="high" + srcset instead. Keep the fallback asset tiny.

         LCP fix: preload the static fallback hero so on first visit (before
         localStorage cache is populated) the browser starts downloading the
         image immediately from the HTML parser — not after JS executes.
         On subsequent visits the cached heroImageUrl takes over via srcset. -->
    <link rel="preload" as="image" href="/hero-mockup.png" fetchpriority="high" />

    <!-- dns-prefetch + preconnect untuk API server (same-origin di production,
         tapi di VPS bisa saja port berbeda). Ini memastikan koneksi ke backend
         sudah warm sebelum fetchSettings() dipanggil, memotong TTFB settings API. -->
    <link rel="preconnect" href="https://vividev.id" />
    <link rel="dns-prefetch" href="https://vividev.id" />

    <!-- Plus Jakarta Sans font — non-blocking load
         Teknik: load sebagai media="print" lalu onload ganti ke media="all".
         Ini mencegah browser menunggu font sebelum render (render-blocking).
         display=optional: tidak ada FOUT/FOIT — browser pakai system font
         pada first visit, font CMS dipakai setelah cached.
         Fallback <noscript> untuk browser tanpa JS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=optional"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=optional"
        rel="stylesheet"
      />
    </noscript>

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ViviDev.id",
      "url": "https://vividev.id",
      "logo": "https://vividev.id/favicon.png",
      "description": "Jasa web developer profesional asal Bandung, Indonesia — membangun website modern, cepat, dan SEO-friendly sejak 2019.",
      "foundingDate": "2019",
      "areaServed": "ID",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+62-857-9811-2370",
        "contactType": "customer service",
        "areaServed": "ID",
        "availableLanguage": ["Indonesian", "English"]
      },
      "sameAs": [
        "https://www.instagram.com/vividev.id",
        "https://wa.me/6285798112370"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- App-shell footer placeholder: reserves 300px so the browser layout
           engine never shifts content when React hydrates and mounts the real
           Footer. Background matches Footer's #0B1849. React replaces this
           div entirely on hydration — no flicker. -->
      <div style="display:flex;flex-direction:column;min-height:100vh">
        <div style="flex:1"></div>
        <footer style="min-height:300px;background:#0B1849"></footer>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
